# Portainer: Stacks > Add stack > Git Repository, compose path "docker-compose.yml",
# then fill in the environment variables (see README).
# On the host instead: cp .env.example .env, edit it, then `docker compose up -d --build`.
services:
  old-dashboard:
    build: .
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8080}:3000"
    environment:
      IMMICH_URL: ${IMMICH_URL:-}
      IMMICH_API_KEY: ${IMMICH_API_KEY:-}
      IMMICH_ALBUM_IDS: ${IMMICH_ALBUM_IDS:-}
      IMMICH_FAVORITES_ONLY: ${IMMICH_FAVORITES_ONLY:-false}
      IMMICH_PLAYLIST_SIZE: ${IMMICH_PLAYLIST_SIZE:-200}
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      HA_ENTITIES: ${HA_ENTITIES:-}
      HA_HIDE_ENTITIES: ${HA_HIDE_ENTITIES:-}
      SLIDE_INTERVAL_SECONDS: ${SLIDE_INTERVAL_SECONDS:-60}
      PHOTO_FIT: ${PHOTO_FIT:-auto}
      SHOW_CLOCK: ${SHOW_CLOCK:-true}
      SHOW_CAPTIONS: ${SHOW_CAPTIONS:-true}
      PANEL_IDLE_SECONDS: ${PANEL_IDLE_SECONDS:-60}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
