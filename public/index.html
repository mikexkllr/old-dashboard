<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dashboard">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <title>Dashboard</title>
</head>
<body>
  <div id="frame">
    <div class="slide" id="slide-a"><img class="slide-fill hidden" alt=""><img class="slide-photo" alt=""></div>
    <div class="slide" id="slide-b"><img class="slide-fill hidden" alt=""><img class="slide-photo" alt=""></div>
    <div class="shade shade-top"></div>
    <div class="shade shade-bottom"></div>
    <div class="clock" id="clock">
      <div class="clock-time" id="clock-time"></div>
      <div class="clock-date" id="clock-date"></div>
    </div>
    <div class="caption hidden" id="caption"></div>
    <div class="message hidden" id="message"><span class="message-text" id="message-text"></span></div>
  </div>

  <div class="panel hidden" id="panel">
    <div class="panel-bar">
      <div class="panel-heading">
        <div class="panel-title">Home</div>
        <div class="panel-date" id="panel-date"></div>
      </div>
      <div class="panel-side">
        <div class="panel-time" id="panel-time"></div>
        <button type="button" class="round-button" id="panel-settings" title="Settings" aria-label="Settings"></button>
        <button type="button" class="close-button" id="panel-close"><span>Photos</span></button>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="panel-note hidden" id="panel-note"></div>
    <div class="content" id="content"></div>
  </div>

  <div class="panel settings hidden" id="settings">
    <div class="panel-bar">
      <div class="panel-heading">
        <div class="panel-title">Settings</div>
        <div class="panel-date">For every screen that shows this dashboard</div>
      </div>
      <div class="panel-side">
        <button type="button" class="close-button" id="settings-done"><span>Done</span></button>
      </div>
    </div>
    <div class="panel-note hidden" id="settings-note"></div>
    <div class="content" id="settings-content"></div>
  </div>

  <div class="sheet-backdrop hidden" id="sheet">
    <div class="sheet">
      <div class="sheet-head">
        <span class="sheet-swatch"><span class="swatch" id="sheet-swatch"></span></span>
        <div class="sheet-titles">
          <div class="sheet-title" id="sheet-title"></div>
          <div class="sheet-sub" id="sheet-sub"></div>
        </div>
        <button type="button" class="close-button" id="sheet-done"><span>Done</span></button>
      </div>
      <div class="sheet-note hidden" id="sheet-note"></div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
