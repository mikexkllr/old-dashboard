<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dashboard">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <title>Dashboard</title>
</head>
<body>
  <div id="frame">
    <img class="slide" id="slide-a" alt="">
    <img class="slide" id="slide-b" alt="">
    <div class="shade"></div>
    <div class="clock" id="clock">
      <div class="clock-time" id="clock-time"></div>
      <div class="clock-date" id="clock-date"></div>
    </div>
    <div class="caption hidden" id="caption"></div>
    <div class="message hidden" id="message"></div>
  </div>

  <div class="panel hidden" id="panel">
    <div class="panel-bar">
      <div class="panel-title">Home</div>
      <button type="button" class="close-button" id="panel-close">Back to photos</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="panel-note hidden" id="panel-note"></div>
    <div class="content" id="content"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
